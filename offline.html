<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>百货经营工作台</title>
<style>
:root{
  --c-primary:#4f46e5;--c-primary-dark:#4338ca;--c-accent:#7c3aed;--c-magenta:#c026d3;
  --grad-header:linear-gradient(120deg,#4f46e5 0%,#7c3aed 48%,#c026d3 100%);
  --grad-primary:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
  --t-1:#0f172a;--t-2:#334155;--t-3:#64748b;--t-4:#94a3b8;
  --c-line:#e5e9f2;--c-bg:#f5f6fb;--c-card:#ffffff;
  --up:#dc2626;--down:#059669;--sh-1:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sh-2:0 4px 16px rgba(15,23,42,.08);--r-md:12px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--c-bg);color:var(--t-1);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
/* 密码门 */
.password-overlay{position:fixed;inset:0;background:var(--grad-header);display:flex;align-items:center;justify-content:center;z-index:9999}
.password-box{background:#fff;padding:36px 40px;border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.3);text-align:center;width:360px}
.password-box h2{font-size:18px;margin-bottom:6px;color:var(--t-1)}
.password-box input{width:100%;padding:11px 14px;border:1.5px solid var(--c-line);border-radius:var(--r-sm);font-size:14px;outline:none;margin:12px 0}
.password-box input:focus{border-color:var(--c-primary)}
.password-box button{width:100%;padding:11px;background:var(--grad-primary);color:#fff;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:600;cursor:pointer}
.password-error{color:var(--up);font-size:13px;margin-top:10px;display:none}
/* 布局 */
.container{max-width:1400px;margin:0 auto;padding:0 20px 60px}
.header{background:var(--grad-header);color:#fff;padding:26px 32px;border-radius:0 0 20px 20px;margin:0 -20px 18px;box-shadow:var(--sh-2)}
.header h1{font-size:23px;font-weight:700;letter-spacing:.5px}
.header .sub{font-size:12.5px;opacity:.92;margin-top:8px;line-height:1.8}
.header .sub b{font-weight:600}
.tab-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;position:sticky;top:0;z-index:50;background:var(--c-bg);padding:10px 0}
.tab-btn{padding:8px 15px;border:1px solid var(--c-line);background:#fff;border-radius:20px;font-size:13px;color:var(--t-2);cursor:pointer;transition:.15s;white-space:nowrap}
.tab-btn:hover{border-color:var(--c-primary);color:var(--c-primary)}
.tab-btn.grp{font-weight:600}
.tab-btn.active{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(79,70,229,.28)}
.tab-content{display:none}
.card{background:var(--c-card);border:1px solid var(--c-line);border-radius:var(--r-md);padding:18px 20px;box-shadow:var(--sh-1);margin-bottom:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:11px;font-weight:500;color:var(--c-primary);background:#eef2ff;padding:2px 8px;border-radius:10px}
.card .desc{font-size:12.5px;color:var(--t-3);margin-bottom:14px;line-height:1.6}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--c-card);border:1px solid var(--c-line);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--sh-1)}
.kpi .k-label{font-size:12px;color:var(--t-3);margin-bottom:6px}
.kpi .k-val{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.kpi .k-val small{font-size:13px;font-weight:600;color:var(--t-3);margin-left:2px}
.kpi .k-note{font-size:11.5px;color:var(--t-4);margin-top:6px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--t-3)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f8f9ff;color:var(--t-2);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1.5px solid var(--c-line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid #f1f3f9;color:var(--t-2)}
tbody tr:hover{background:#fbfbff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:520px;overflow:auto;border-radius:var(--r-sm);border:1px solid var(--c-line)}
.scroll td.nw,.scroll th.nw{white-space:nowrap}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;line-height:18px}
.chip.g{background:#ecfdf5;color:#047857}.chip.r{background:#fef2f2;color:#b91c1c}
.chip.b{background:#eff6ff;color:#1d4ed8}.chip.y{background:#fffbeb;color:#b45309}
.chip.p{background:#f5f3ff;color:#6d28d9}.chip.n{background:#f1f5f9;color:#475569}
.insight{background:linear-gradient(135deg,#f8f7ff,#fdf6ff);border:1px solid #e9e5ff;border-radius:var(--r-md);padding:16px 20px}
.insight li{list-style:none;padding:7px 0 7px 22px;position:relative;font-size:13px;color:var(--t-2);line-height:1.7}
.insight li:before{content:"";position:absolute;left:6px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--c-primary)}
.insight li b{color:var(--t-1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--t-3)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.note{font-size:12px;color:var(--t-3);background:#f8f9ff;border-left:3px solid var(--c-primary);padding:9px 12px;border-radius:0 6px 6px 0;margin-top:12px;line-height:1.7}
.funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.funnel-row .fl{width:96px;font-size:12.5px;color:var(--t-2);text-align:right}
.funnel-row .fb{flex:1;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;color:#fff;font-size:13px;font-weight:600;transition:width .3s}
.funnel-row .fc{width:110px;font-size:12px;color:var(--t-3)}
.empty{padding:40px;text-align:center;color:var(--t-4);font-size:13px}
svg{display:block;width:100%;height:auto}
/* ---- 时间段选择器 ---- */
.rb-wrap{background:#fff;border:1px solid var(--c-line);border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh-1)}
.rb-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rb-label{font-size:12.5px;color:var(--t-3);font-weight:600;letter-spacing:.02em}
.rb-presets{display:flex;flex-wrap:wrap;gap:6px}
.rb-btn{font:inherit;font-size:12.5px;padding:5px 13px;border-radius:16px;border:1px solid var(--c-line);background:#fff;color:var(--t-2);cursor:pointer;transition:all .15s;line-height:1.4}
.rb-btn:hover{border-color:#c7d2fe;color:var(--c-primary);background:#f8f7ff}
.rb-btn.on{background:var(--grad-primary);border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.28)}
.rb-custom{display:flex;align-items:center;gap:6px;margin-left:8px;padding-left:12px;border-left:1px solid var(--c-line)}
.rb-custom input[type=date]{font:inherit;font-size:12.5px;padding:4px 8px;border:1px solid var(--c-line);border-radius:7px;color:var(--t-2);background:#fff}
.rb-custom .sep{font-size:12px;color:var(--t-4)}
.rb-custom button{font:inherit;font-size:12.5px;padding:5px 14px;border-radius:7px;border:none;background:var(--grad-primary);color:#fff;cursor:pointer;font-weight:600}
.rb-custom button:hover{filter:brightness(1.06)}
.rb-status{margin-left:auto;font-size:12px;color:var(--t-3);white-space:nowrap}
.rb-status b{color:var(--c-primary);font-variant-numeric:tabular-nums}
.rb-hint{font-size:11.5px;color:var(--t-4);margin-top:9px;padding-top:9px;border-top:1px dashed var(--c-line);line-height:1.7}
.rb-hint i{font-style:normal;color:var(--t-3);background:#f1f5f9;border-radius:4px;padding:0 5px;margin:0 2px}
.rb-warn{margin-top:8px;font-size:11.5px;color:#b45309;background:#fffbeb;border-radius:6px;padding:6px 10px;line-height:1.6;display:none}
@media(max-width:900px){.rb-status{margin-left:0;width:100%}.rb-custom{margin-left:0;padding-left:0;border-left:none}}
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr}}
@media(max-width:768px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.header{padding:20px}.container{padding:0 12px 40px}}
</style>
</head>
<body>

<div class="password-overlay" id="pwdOverlay">
  <div class="password-box">
    <h2>百货经营工作台</h2>
    <p style="color:#64748b;font-size:13px">望辰-Crown事业部 · 请输入密码访问</p>
    <input type="password" id="pwdInput" placeholder="密码" onkeypress="if(event.key==='Enter')checkPwd()">
    <button onclick="checkPwd()">进入工作台</button>
    <div class="password-error" id="pwdError">密码错误，请重试</div>
  </div>
</div>

<div class="container" id="mainContent" style="display:none">
  <div class="header">
    <h1>百货经营工作台</h1>
    <div class="sub">
      经营主体：<b>望辰-Crown事业部（新媒体百货中心）</b>　|　下辖：星辰一部 / 二部 / 三部 / 四部<br>
      数据源：金山多维表《新媒体百货中心》8 张表全量数据　|　业绩区间：<b id="hRange">—</b>　|　快照：<b id="hSnap">—</b>
    </div>
  </div>
  <div class="rb-wrap">
    <div class="rb-row">
      <span class="rb-label">时间段</span>
      <div class="rb-presets" id="rbPresets"></div>
      <div class="rb-custom">
        <input type="date" id="dFrom"><span class="sep">至</span><input type="date" id="dTo">
        <button onclick="applyCustomRange()">应用</button>
      </div>
      <span class="rb-status" id="rbStatus">—</span>
      <button class="rb-btn" id="rbReload" onclick="reloadLive()" title="重新拉取最新数据（在线版可用）">⟳ 刷新数据</button>
    </div>
    <div class="rb-hint" id="rbHint"></div>
    <div class="rb-warn" id="rbWarn"></div>
    <div class="rb-warn" id="loadErr" style="display:none"></div>
    <div id="loadHint" style="font-size:12px;color:var(--t-3);margin-top:8px"></div>
  </div>
  <div class="tab-bar" id="tabBar"></div>
  <div id="tabContents"></div>
</div>

工","note":"内容运营员工工作沟通会\n概要\n本次会议沟通了内容运营员工的工作进展与试岗考核结果，确认其近期发布的内容浏览量表现优异，当前工作流程顺畅无卡点，正式通知其试岗期通过，后续调整组织架构归属。\n要点\n工作成果与进度\n近期发布的非抠图、非视频类内容浏览量已达15万+，即将突破16万，内容创作效果优异\n过往曾在个人账号产出浏览量**40万+**的爆文\n当前负责学习椅相"},{"n":"李甜甜","dept":"星辰二部","type":"晋升面谈","date":"","by":"杨蓓蕾","stage":"正式员工","note":"员工P3级别晋升沟通会\n概要\n本次为员工晋升至P3级别的沟通访谈，确认了该员工过往优秀的工作业绩，了解到其业绩优异的原因包括品类优势、上级指导、重点维护评论区等，同时同步了其上级对他的高度评价，也沟通了其后续独立带品的发展规划相关安排。\n要点\n过往工作成果复盘\n员工自入职以来晋升速度较快，自述核心原因包括三点：\n所在的自行车品类受众广，市场需求基础好\n组长、"},{"n":"周师豪","dept":"星辰三部","type":"试岗期面谈","date":"2026-08-24","by":"杨蓓蕾","stage":"试用期","note":"新员工工作适应情况沟通会\n概要\n本次会议沟通了新员工的带教安排、工作适配情况，了解到其当前负责大路灯产品的内容创作与多平台账号运营，存在多平台账号管理混乱、代发账号质量不佳易账号封禁等问题，同步了当前账号筹备、内容储备的进展。\n要点\n带教与工作安排\n当前新员工工作量与常规员工任务量一致\n带教模式：自行梳理工作内容后和组长确认即可执行，拍视频会安排专人协同\n工"},{"n":"赵晨露","dept":"星辰二部","type":"试岗期面谈","date":"2026-08-24","by":"许志远","stage":"试用期","note":"试岗期结果沟通会议\n概要\n本次会议告知员工已通过试岗期，沟通其试岗期间的工作节奏、工作量、完成情况、技能成长及工作遇到的问题，确认员工由孙小玉带教，目前负责德伦姆净水器相关工作内容。\n要点\n试岗结果告知\n明确告知员工已通过试岗期\n工作完成情况沟通\n日常工作量为2张抠图、2个视频、2张痛点图，合计6个任务，每日基本可在18:00前完成\n员工初始无相关工作经验，"},{"n":"王苗苗","dept":"星辰二部","type":"试岗期面谈","date":"2026-08-26","by":"许志远","stage":"试用期","note":"新员工王苗苗面谈沟通总结\n一、试岗期工作开展情况\n \n1. 工作量变化：入职后工作量逐步递增，从每日产出1篇，逐步提升至当前每日6篇，次日起固定每日7篇。负责新品洗地机内容创作，与翟佳琪搭档开展工作。\n2. 内容发布现状：入职第三天就开始发布内容；优先选用外部代发渠道发布，公司自有账号流量表现不及代发渠道，目前整体流量表现一般，两人还在摸索优化。\n3. 工作"},{"n":"惠思莹","dept":"星辰一部","type":"试岗期面谈","date":"2026-08-26","by":"许志远","stage":"试用期","note":"新员工惠思莹面谈沟通总结\n一、工作内容与试岗工作现状\n \n1. 日常工作流程：每日首先统计前一日数据，登记代发评论报销金额；筛选当日笔记对标素材，提交主管审核；每日产出笔记10篇起，稿件写完交由主管审核修改；稿件修改完成后次日进行发布。\n2. 发布情况：已经正式发布笔记2‑3天，负责产品为山林颂五红粉；手上共6个账号，日常自发6篇笔记；账号当前数据表现不佳，"},{"n":"曾艳梅","dept":"星辰一部","type":"试岗期面谈","date":"2026-08-27","by":"许志远","stage":"试用期","note":"# 试岗通过沟通录音内容总结\n本次为公司BP与员工曾艳梅的试岗期结果面谈，时间2026年8月27日，**曾艳梅试岗考核结果为通过**。谈话围绕工作复盘、工作方法、遇到的问题、个人职业规划、公司晋升制度、薪资、考核责任书、考勤规则等内容展开，后续签署薪资确认单与试用期目标责任书。\n\n## 一、工作情况复盘\n1. **任务完成情况**：初期每日任务量约10个，可"},{"n":"王瑞鑫","dept":"星辰一部","type":"离职面谈（优化）","date":"2026-08-27","by":"许志远","stage":"试岗","note":"试岗期考核及离职沟通录音内容总结\n本次是公司BP与试岗员工王瑞鑫的离职沟通谈话，沟通背景为王瑞鑫试岗考核未达标，公司与其沟通试岗不通过、办理离职、薪资结算等相关事宜，时间为2026年8月27日上午，员工出勤截止至当日上午。\n\n## 一、公司提出试岗未通过的理由\n1. 该岗位有每日固定产出任务，员工8月18‑24日的有效账号产出数据波动大，整体和岗位要求工作量"},{"n":"王瑞鑫","dept":"星辰一部","type":"离职面谈（优化）","date":"2026-08-27","by":"许志远","stage":"试岗","note":"### 1. 王瑞鑫\n\n1. **评估结果：试岗不通过**。工作态度积极主动，学习态度得到主管认可，但岗位产出数据和同期人员差距较大；岗位受账号质量影响，但刨除特殊因素，整体产出未达标。员工反馈自己多次遇到账号封禁、私信无回复的问题，同批次另一名试岗人员后期分配兼职平台资源，自己没有拿到。BP 表示对比评估时已经剔除对方拿到兼职平台当日的数据。\n2. **协"},{"n":"王珂","dept":"星辰二部","type":"离职面谈（优化）","date":"2026-08-27","by":"许志远","stage":"试岗","note":"### . 王珂（小红书岗位）\n\n1. **试岗未通过**：工作态度好，交代内容可以及时修正，适应力尚可；卡点在于排版抠图调整反复修改，**产出进度远低于新人平均水平**（新人一般当日可以完成 70‑80%，她次日才完成），节奏与岗位不匹配。\n2. **薪资结算：前三天 50 元 / 天，本次共计 100 元；薪资 9 月 15 号发放到入职提供银行卡。**"},{"n":"万靖怡","dept":"星辰一部","type":"试岗期面谈","date":"2026-09-03","by":"杨蓓蕾","stage":"试用期","note":"本次杨贝蕾与聪慧同候选人进行的试岗期沟通，围绕工作适应情况、试用期考核标准及资源需求展开。会议确认候选人通过试岗期，明确了以人效3万为提前转正目标的考核机制，并同步了架构调整与入职福利等行政事项，整体反馈积极正向。\n\n## 试岗期工作复盘\n\n- **开品业务适应情况**\n  - 候选人初期因缺乏百货开品经验存在卡点，经与经理多轮沟通后已明确新品方向，问题基本"},{"n":"曹师箐","dept":"星辰一部","type":"试岗期面谈","date":"2026-09-03","by":"杨蓓蕾","stage":"试用期","note":"本次杨蓓蕾（BP）与新媒体主管候选人进行试岗期面谈，确认其试岗通过并签署试用期目标责任书。双方围绕“果皮”新品推广进度、团队扩充计划及资源需求展开沟通，明确了提前转正的人效标准，并约定后续调整组织架构至正式部门。\n\n## 试岗反馈与工作进展\n\n- **试岗整体评价**\n  - BP 反馈主管及团队对候选人的工作表现评价较好，**试岗期考核通过**。\n  - "},{"n":"杨晨晨","dept":"星辰二部","type":"试岗期面谈","date":"2026-09-03","by":"罗思会","stage":"试用期","note":"本次HRBP与新员工晨晨的试岗期回顾与转正流程沟通，围绕工作适应情况、试用期安排、薪资确认及组织架构调整等内容展开，明确了后续工作目标与支持机制。\n\n## 试岗期结果通报\n\n- **试岗期通过确认**\n  - HRBP罗思会告知晨晨已顺利通过试岗期，主管反馈工作表现较为OK。\n  - 强调无需紧张，可边吃边聊，营造轻松沟通氛围。\n\n## 工作适应情况了解\n\n"},{"n":"翟佳琪","dept":"星辰二部","type":"试岗期面谈","date":"2026-09-03","by":"许志远1","stage":"正式员工","note":"> **主题**: 新员工入职一周面谈\n> **时间**: 2026-09-03 17:02:11\n> **参与人**: 木易\n\n本次HRBP与新员工进行入职一周后的试岗期沟通，围绕工作适应情况、业务技能短板、转正考核标准及薪资福利疑问展开。双方确认了试用期提前转正的具体指标，HRBP针对员工提出的薪资结构差异及病假政策进行了澄清与记录，并安排了后续薪资复核"},{"n":"郭琳冰","dept":"星辰二部","type":"离职面谈（优化）","date":"2026-09-04","by":"杨蓓蕾","stage":"试岗","note":"本次会议主要沟通了员工在试岗期间的工作表现及存在的问题。HRBP指出员工工作积极性获主管认可，但因 <script>
/* DATA 是"当前视图"：启动时等于 RAW，切换时间段后由 filterView() 重算替换。 */
var DATA = null;
var RANGE = { key:'all', from:null, to:null, label:'全部区间' };

var LIVE_URL = 'data.json';
/* 兜底：页面被别的站点 document.write 嵌入时，相对路径会指向错误域名，
   此时退回 GitHub Pages 的绝对地址，保证仍能取到数。 */
var LIVE_FALLBACK = 'https://15750767173.github.io/baike-workbench/data.json';

/* ============ 工具函数 ============ */
const $ = id => document.getElementById(id);
const fmtW = v => (Math.abs(v) >= 10000 ? (v/10000).toFixed(1)+'万' : Math.round(v).toLocaleString());
const fmtN = v => Math.round(v).toLocaleString('zh-CN');
const fmt2 = v => v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (a,b) => b ? (a/b*100) : 0;
const sign = v => v>0?'+':'';
const momCls = v => v>0?'up':(v<0?'down':'flat');
const momTxt = v => v==null?'—':sign(v)+v.toFixed(1)+'%';
const MN = m => m.slice(5)+'月';
const BRAND_COLORS = ['#4f46e5','#7c3aed','#c026d3','#db2777','#ea580c','#ca8a04','#0891b2','#059669','#64748b'];
const PALETTE = BRAND_COLORS;

/* ============ SVG 图表 ============ */
function niceMax(v){
  if(!isFinite(v)||v<=0) return 1;
  const exp=Math.floor(Math.log10(v)), base=Math.pow(10,exp), n=v/base;
  const step = n<=1?1:(n<=2?2:(n<=2.5?2.5:(n<=5?5:10)));
  return step*base;
}
function svgWrap(inner, h, vw){
  vw = vw || 1000;
  return `<svg viewBox="0 0 ${vw} ${h}" preserveAspectRatio="xMidYMid meet" style="max-height:${h}px">${inner}</svg>`;
}
// 竖向柱状
function barChart(labels, values, opt){
  opt = opt||{};
  const W=opt.vw||1000, H=opt.h||300, PL=62, PR=22, PT=26, PB=44;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max = niceMax(Math.max(...values,1));
  const n=values.length, step=iw/n, bw=Math.min(step*0.56, 70);
  let g='';
  // 网格
  for(let i=0;i<=4;i++){
    const y=PT+ih*i/4, v=max*(1-i/4);
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#eef1f8" stroke-width="1"/>`;
    g+=`<text x="${PL-10}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a3b8">${fmtW(v)}</text>`;
  }
  values.forEach((v,i)=>{
    const h=Math.max(ih*v/max,1), x=PL+step*i+(step-bw)/2, y=PT+ih-h;
    const c = opt.colorFn? opt.colorFn(i,v) : 'url(#barGrad)';
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${c}"/>`;
    if(!opt.hideVal){
      g+=`<text x="${x+bw/2}" y="${y-7}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">${opt.vfmt?opt.vfmt(v):fmtW(v)}</text>`;
    }
    if(labels[i]!=='') g+=`<text x="${x+bw/2}" y="${H-18}" text-anchor="middle" font-size="11.5" fill="#64748b">${labels[i]}</text>`;
    if(opt.sub && opt.sub[i]!=null){
      g+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="10.5" fill="${opt.sub[i]>=0?'#dc2626':'#059669'}">${opt.sub[i]>=0?'+':''}${opt.sub[i]}%</text>`;
    }
  });
  const defs=`<defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs>`;
  return svgWrap(defs+g, H, W);
}
// 折线（含均线）
function lineChart(dates, values, opt){
  opt=opt||{};
  const W=opt.vw||1000,H=opt.h||300,PL=62,PR=22,PT=22,PB=42;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(...values), min=Math.min(...values,0);
  const rng=(max-min)||1;
  const X=i=>PL+iw*i/(values.length-1||1);
  const Y=v=>PT+ih*(1-(v-min)/rng);
  let g='';
  for(let i=0;i<=4;i++){
    const y=PT+ih*i/4, v=max-rng*i/4;
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#eef1f8"/>`;
    g+=`<text x="${PL-10}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a3b8">${fmtW(v)}</text>`;
  }
  let pts=values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  g+=`<polygon points="${PL},${PT+ih} ${pts} ${W-PR},${PT+ih}" fill="url(#areaGrad)" opacity=".55"/>`;
  g+=`<polyline points="${pts}" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>`;
  // 7日均线
  const ma=values.map((_,i)=>{const s=Math.max(0,i-6);const seg=values.slice(s,i+1);return seg.reduce((a,b)=>a+b,0)/seg.length;});
  g+=`<polyline points="${ma.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  // x 轴月份刻度
  let last='';
  dates.forEach((d,i)=>{
    const m=d.slice(0,7);
    if(m!==last){ last=m;
      g+=`<line x1="${X(i)}" y1="${PT+ih}" x2="${X(i)}" y2="${PT+ih+4}" stroke="#cbd5e1"/>`;
      g+=`<text x="${X(i)}" y="${H-16}" font-size="11" fill="#64748b">${MN(m)}</text>`;
    }
  });
  const defs=`<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#818cf8" stop-opacity=".55"/><stop offset="100%" stop-color="#c4b5fd" stop-opacity=".06"/></linearGradient></defs>`;
  return svgWrap(defs+g,H,W);
}
// 堆叠柱
function stackedChart(labels, series, opt){
  opt=opt||{};
  const W=opt.vw||1000,H=opt.h||320,PL=62,PR=22,PT=24,PB=44;
  const iw=W-PL-PR, ih=H-PT-PB;
  const totals=labels.map((_,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0));
  const max=niceMax(Math.max(...totals,1));
  const n=labels.length, step=iw/n, bw=Math.min(step*0.58,64);
  let g='';
  for(let i=0;i<=4;i++){
    const y=PT+ih*i/4;
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#eef1f8"/>`;
    g+=`<text x="${PL-10}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a3b8">${fmtW(max*(1-i/4))}</text>`;
  }
  labels.forEach((lb,i)=>{
    let acc=0;
    series.forEach((s,si)=>{
      const v=s.values[i]||0; if(v<=0) return;
      const h=ih*v/max, x=PL+step*i+(step-bw)/2, y=PT+ih-h-acc;
      g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0.8)}" fill="${s.color}"/>`;
      acc+=h;
    });
    g+=`<text x="${PL+step*i+step/2}" y="${PT+ih-acc-6}" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">${fmtW(totals[i])}</text>`;
    g+=`<text x="${PL+step*i+step/2}" y="${H-18}" text-anchor="middle" font-size="11.5" fill="#64748b">${lb}</text>`;
  });
  return svgWrap(g,H,W);
}
// 横向条
function hbars(items, opt){
  opt=opt||{};
  const W=opt.vw||1000, rowH=opt.rh||30, PL=opt.pl||150, PR=opt.pr||(opt.pctOf?134:110), PT=6;
  const H=PT+items.length*rowH+8;
  const iw=W-PL-PR;
  const max=Math.max(...items.map(i=>Math.abs(i.v)),1);
  let g='';
  items.forEach((it,i)=>{
    const y=PT+i*rowH, w=iw*Math.abs(it.v)/max;
    g+=`<text x="${PL-12}" y="${y+15}" text-anchor="end" font-size="12" fill="#334155">${it.k}</text>`;
    g+=`<rect x="${PL}" y="${y+5}" width="${iw}" height="15" rx="7" fill="#f1f4fb"/>`;
    g+=`<rect x="${PL}" y="${y+5}" width="${Math.max(w,2)}" height="15" rx="7" fill="${it.c||'#6366f1'}"/>`;
    g+=`<text x="${PL+iw+10}" y="${y+16}" font-size="12" font-weight="600" fill="#334155">${opt.vfmt?opt.vfmt(it.v):fmtW(it.v)}</text>`;
    if(opt.pctOf){
      g+=`<text x="${W-6}" y="${y+16}" text-anchor="end" font-size="11" fill="#94a3b8">${(it.v/opt.pctOf*100).toFixed(1)}%</text>`;
    }
  });
  const defs=`<defs><linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs>`;
  return svgWrap(defs+g,H,W);
}
// 环形图
function donut(items, opt){
  opt=opt||{};
  const W=opt.vw||1000, H=opt.h||260, R=(W<640?78:96), cx=(W<640?R+26:210), cy=H/2;
  const total=items.reduce((a,b)=>a+b.v,0)||1;
  let ang=-Math.PI/2, g='';
  items.forEach((it,i)=>{
    const a=it.v/total*Math.PI*2;
    const x1=cx+R*Math.cos(ang), y1=cy+R*Math.sin(ang);
    const x2=cx+R*Math.cos(ang+a), y2=cy+R*Math.sin(ang+a);
    const large=a>Math.PI?1:0;
    g+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${it.c}" opacity=".92"/>`;
    ang+=a;
  });
  g+=`<circle cx="${cx}" cy="${cy}" r="${R*0.58}" fill="#fff"/>`;
  g+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="12" fill="#64748b">合计</text>`;
  g+=`<text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">${fmtW(total)}</text>`;
  items.forEach((it,i)=>{
    const y=26+i*26;
    const lx=cx+R+(W<640?32:70);
    g+=`<rect x="${lx}" y="${y-9}" width="10" height="10" rx="2" fill="${it.c}"/>`;
    g+=`<text x="${lx+16}" y="${y}" font-size="12.5" fill="#334155">${it.k}</text>`;
    g+=`<text x="${W-8}" y="${y}" text-anchor="end" font-size="12.5" font-weight="600" fill="#334155">${fmtW(it.v)} · ${(it.v/total*100).toFixed(1)}%</text>`;
  });
  return svgWrap(g,Math.max(H,items.length*26+30),W);
}
function table(headers, rows, opt){
  opt=opt||{};
  const N=opt.nw||[];
  const cls=i=>[(opt.numCols&&opt.numCols.includes(i)?'num':''),(N.includes(i)?'nw':'')].filter(Boolean).join(' ');
  const th=headers.map((h,i)=>`<th class="${cls(i)}">${h}</th>`).join('');
  const tb=rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${cls(i)}">${c}</td>`).join('')+'</tr>').join('');
  return `<div class="scroll" style="${opt.maxH?'max-height:'+opt.maxH+'px':''}"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`;
}

/* ============ 时间段：视图重算引擎 ============ */
function pad2(n){ return n<10?'0'+n:''+n; }
function prevMonthOf(m){
  var y=+m.slice(0,4), mo=+m.slice(5,7)-1;
  if(mo===0){ mo=12; y--; }
  return y+'-'+pad2(mo);
}
function shiftMonth(m,delta){
  var y=+m.slice(0,4), mo=+m.slice(5,7)+delta;
  y += Math.floor((mo-1)/12);
  mo = ((mo-1)%12+12)%12+1;
  return y+'-'+pad2(mo);
}
function addDays(d,delta){
  var t=new Date(d+'T00:00:00');
  t.setDate(t.getDate()+delta);
  return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());
}
function monthFirstIn(ds,m){ for(var i=0;i<ds.length;i++) if(ds[i].slice(0,7)===m) return ds[i]; return null; }
function monthLastIn(ds,m){ for(var i=ds.length-1;i>=0;i--) if(ds[i].slice(0,7)===m) return ds[i]; return null; }

/* 把原始 RAW 按 [from,to] 重算成视图。日粒度指标精确到天；
   品牌/品类/产品/目标只有月度口径，取区间覆盖月份的整月值，并在页面显式标明。 */
function filterView(raw, from, to){
  var dates=[], net=[];
  for(var i=0;i<raw.dates.length;i++){
    var d=raw.dates[i];
    if(d>=from && d<=to){ dates.push(d); net.push(raw.net_daily[i]); }
  }
  if(!dates.length) return null;

  // 每月可用天数（原始）与区间命中天数
  var rawDays={}, hitDays={};
  raw.dates.forEach(function(x){ var m=x.slice(0,7); rawDays[m]=(rawDays[m]||0)+1; });
  dates.forEach(function(x){ var m=x.slice(0,7); hitDays[m]=(hitDays[m]||0)+1; });
  var months=Object.keys(hitDays).sort();

  var rawMonNet={}; (raw.monthly||[]).forEach(function(x){ rawMonNet[x.m]=x.net; });

  // 月度序列：净业绩按区间内命中天数合计
  var monthly = months.map(function(m){
    var s=0,n=0;
    for(var i=0;i<dates.length;i++){ if(dates[i].slice(0,7)===m){ s+=net[i]; n++; } }
    var full = (hitDays[m]===rawDays[m]);
    var pm = prevMonthOf(m);
    var mom = (full && rawMonNet[pm]!=null) ? Math.round((s/rawMonNet[pm]-1)*1000)/10 : null;
    return {m:m, net:s, days:n, avg:n?s/n:0, mom:mom, full:full};
  });

  // 在岗人数（月末快照）与人效
  var hc={}, eff={};
  months.forEach(function(m){ if(raw.hc_month && raw.hc_month[m]) hc[m]=raw.hc_month[m]; });
  monthly.forEach(function(x){
    var h=hc[x.m];
    eff[x.m] = (h && h.total) ? x.net/h.total : null;
  });

  // 月粒度字典裁剪（保持 {键:{月:值}} 结构，渲染代码不用改）
  function sliceMonthDict(dict){
    var out={};
    Object.keys(dict||{}).forEach(function(k){
      var o={}, any=false;
      months.forEach(function(m){ if(dict[k][m]!=null){ o[m]=dict[k][m]; any=true; } });
      if(any) out[k]=o;
    });
    return out;
  }
  var brand_month = sliceMonthDict(raw.brand_month);
  var cat_month   = sliceMonthDict(raw.cat_month);
  var prod_month  = sliceMonthDict(raw.prod_month);

  // 爆文：按发布日筛选
  var bwAll = raw.baowen||[];
  var bw = bwAll.filter(function(r){
    if(!r.d || !/^\d{4}-\d{2}-\d{2}/.test(r.d)) return RANGE.key==='all';
    return r.d>=from && r.d<=to;
  });
  function agg(rows,keyFn){
    var o={};
    rows.forEach(function(r){
      var k=keyFn(r)||'(空)';
      o[k]=o[k]||{cnt:0,like:0,read:0,pt:0};
      o[k].cnt++; o[k].like+=(r.like||0); o[k].read+=(r.read||0); o[k].pt+=(r.pt||0);
    });
    return o;
  }
  var bwTotal={cnt:bw.length, like:0, read:0, pt:0, people:0, hit10k:0, over100k:0};
  var bwPeople={};
  bw.forEach(function(r){
    bwTotal.like+=(r.like||0); bwTotal.read+=(r.read||0); bwTotal.pt+=(r.pt||0);
    if(r.n && r.n!=='(未署名)') bwPeople[r.n]=1;
    if((r.like||0)>=10000) bwTotal.hit10k++;
    if((r.read||0)>=100000) bwTotal.over100k++;
  });
  bwTotal.people=Object.keys(bwPeople).length;

  // 招聘按月裁剪
  var rm={}; months.forEach(function(m){ if(raw.recruit_month && raw.recruit_month[m]) rm[m]=raw.recruit_month[m]; });

  // 汇总
  var netSum = net.reduce(function(a,b){return a+b;},0);
  var dayCnt = dates.length;
  var prodSum = 0;
  Object.keys(brand_month).forEach(function(k){
    Object.keys(brand_month[k]).forEach(function(m){ prodSum += brand_month[k][m]; });
  });

  // 环比：整月对齐时按「前 N 个自然月」；否则按「前 N 天等长区间」
  var allFull = monthly.every(function(x){ return x.full; });
  var prevNet=0, prevCnt=0, rangeMom=null;
  if(allFull){
    var prevSum=0, okPrev=true;
    for(var q=1;q<=months.length;q++){
      var pm2=shiftMonth(months[0], -q);
      if(rawMonNet[pm2]==null){ okPrev=false; break; }
      prevSum += rawMonNet[pm2];
    }
    rangeMom = (okPrev && prevSum) ? Math.round((netSum/prevSum-1)*1000)/10 : null;
  } else {
    var prevTo = addDays(from,-1);
    var prevFrom = addDays(prevTo, -(dayCnt-1));
    for(var j=0;j<raw.dates.length;j++){
      if(raw.dates[j]>=prevFrom && raw.dates[j]<=prevTo){ prevNet+=raw.net_daily[j]; prevCnt++; }
    }
    rangeMom = (prevCnt===dayCnt && prevNet) ? Math.round((netSum/prevNet-1)*1000)/10 : null;
  }

  // 人均产值：按各月在区间内的天数加权
  var wsum=0, wtotal=0;
  monthly.forEach(function(x){ var h=hc[x.m]; if(h && h.total){ wsum += x.days; wtotal += h.total*x.days; } });
  var hcAvg = wsum ? wtotal/wsum : null;

  var inSum=0, outSum=0;
  months.forEach(function(m){ if(hc[m]){ inSum += (hc[m].in||0); outSum += (hc[m].out||0); } });

  // 目标（仅有目标表的月份）
  var tgtSum=0, tgtNetSum=0, tgtMonths=[];
  months.forEach(function(m){
    if(raw.targets_sum && raw.targets_sum[m]){
      tgtSum += raw.targets_sum[m].target||0;
      tgtNetSum += (rawMonNet[m]||0);
      tgtMonths.push(m);
    }
  });

  // 覆盖月份的整月净业绩合计（品牌/品类/产品等整月口径指标的分母）
  var monthNetFull = 0;
  months.forEach(function(m){ monthNetFull += (rawMonNet[m]||0); });

  var kpi = Object.assign({}, raw.kpi, {
    cur_month: months[months.length-1],
    prev_month: prevMonthOf(months[0]),
    cur_net: netSum,
    cur_days: dayCnt,
    cur_avg: dayCnt ? netSum/dayCnt : 0,
    mom: rangeMom,
    mom_basis: allFull ? 'month' : 'day',
    prev_net: prevCnt===dayCnt ? prevNet : null,
    eff_now: hcAvg ? netSum/hcAvg : null,
    eff_prev: null,
    net_7m: netSum,
    in_cur: inSum,
    out_cur: outSum,
    range_from: from,
    range_to: to,
    range_days: dayCnt,
    hc_avg: hcAvg,
    tgt_sum: tgtSum,
    tgt_net: tgtNetSum,
    tgt_months: tgtMonths,
    month_net_full: monthNetFull
  });

  var partial = monthly.some(function(x){ return !x.full; });

  return Object.assign({}, raw, {
    dates: dates,
    net_daily: net,
    brand_daily: (function(){
      var o={};
      Object.keys(raw.brand_daily||{}).forEach(function(k){
        var arr=raw.brand_daily[k], out=[];
        for(var i=0;i<raw.dates.length;i++){
          if(raw.dates[i]>=from && raw.dates[i]<=to) out.push(arr[i]);
        }
        o[k]=out;
      });
      return o;
    })(),
    monthly: monthly,
    hc_month: hc,
    eff_month: eff,
    brand_month: brand_month,
    cat_month: cat_month,
    prod_month: prod_month,
    baowen: bw,
    bw_by_dept: agg(bw, function(r){return r.dept;}),
    bw_by_grp: agg(bw, function(r){return r.grp;}),
    bw_by_person: Object.fromEntries(Object.entries(agg(bw, function(r){return r.n;}))
      .sort(function(a,b){ return b[1].cnt-a[1].cnt; })),
    bw_by_prod: agg(bw, function(r){return r.p;}),
    bw_by_month: agg(bw, function(r){ return (r.d&&/^\d{4}-\d{2}/.test(r.d)) ? r.d.slice(0,7) : '(未填)'; }),
    bw_total: bwTotal,
    recruit_month: rm,
    recon: {prod_sum: prodSum, net_sum: netSum,
            gap_days: (raw.recon?raw.recon.gap_days:0), gap: netSum-prodSum},
    kpi: kpi,
    __months: months,
    __partial: partial,
    __rawDays: rawDays,
    __rawNetOf: function(m){ return rawMonNet[m]||0; }
  });
}

/* ============ 时间段：预设与交互 ============ */
function presetRange(key){
  var ds=RAW.dates, last=ds[ds.length-1], first=ds[0], n=ds.length;
  function back(k){ return ds[Math.max(0, n-k)]; }
  if(key==='d7')    return {from:back(7),  to:last, label:'近 7 天'};
  if(key==='d30')   return {from:back(30), to:last, label:'近 30 天'};
  if(key==='m1'){
    var m=last.slice(0,7);
    return {from:monthFirstIn(ds,m), to:last, label:'本月（'+m+'）'};
  }
  if(key==='mprev'){
    var pm=prevMonthOf(last.slice(0,7));
    var f=monthFirstIn(ds,pm), t=monthLastIn(ds,pm);
    if(!f) return null;
    return {from:f, to:t, label:'上月（'+pm+'）'};
  }
  if(key==='m3'||key==='m6'){
    var k=key==='m3'?3:6;
    var start=shiftMonth(last.slice(0,7), -(k-1));
    var f2=monthFirstIn(ds,start) || first;
    return {from:f2, to:last, label:'近 '+k+' 个月'};
  }
  return {from:first, to:last, label:'全部区间'};
}

var PRESETS=[
  {k:'d7',   t:'近 7 天'},
  {k:'d30',  t:'近 30 天'},
  {k:'m1',   t:'本月'},
  {k:'mprev',t:'上月'},
  {k:'m3',   t:'近 3 月'},
  {k:'m6',   t:'近 6 月'},
  {k:'all',  t:'全部'}
];

function setRange(key, from, to, label){
  var v = filterView(RAW, from, to);
  if(!v){ alert('该时间段内没有业绩数据，请调整起止日期'); return false; }
  DATA = v;
  RANGE = {key:key, from:from, to:to, label:label};
  renderRangeBar();
  buildTabs();
  return true;
}

function applyCustomRange(){
  var f=$('dFrom').value, t=$('dTo').value;
  if(!f || !t){ alert('请先选择起止日期'); return; }
  if(f>t){ alert('起始日期不能晚于结束日期'); return; }
  setRange('custom', f, t, f+' ~ '+t);
}

function renderRangeBar(){
  var box=$('rbPresets');
  box.innerHTML = PRESETS.map(function(p){
    var on = (RANGE.key===p.k)?' on':'';
    return '<button class="rb-btn'+on+'" data-k="'+p.k+'">'+p.t+'</button>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.rb-btn'), function(b){
    b.onclick=function(){
      var r=presetRange(b.getAttribute('data-k'));
      if(r) setRange(b.getAttribute('data-k'), r.from, r.to, r.label);
    };
  });
  $('dFrom').value = RANGE.from; $('dTo').value = RANGE.to;
  var K=DATA.kpi;
  $('rbStatus').innerHTML = '<b>'+RANGE.label+'</b>　'+K.range_days+' 天　共 <b>'+fmtW(K.cur_net)+'</b>';
  $('rbHint').innerHTML = '<i>日粒度</i>净业绩、日均、爆文按所选日期精确统计　'
    + '<i>月粒度</i>品牌 / 品类 / 产品 / 入离职 / 目标按<b>覆盖月份的整月值</b>统计　'
    + '<i>快照</i>在岗人数、编制、招聘在途、部门结构为当前时点，不随区间变化';
  var w=$('rbWarn');
  if(RANGE.key==='custom' && DATA.__partial){
    var pm=DATA.__months.filter(function(m){ return m===DATA.__months[DATA.__months.length-1]; });
    w.style.display='block';
    w.innerHTML='所选区间不是完整自然月：品牌 / 品类 / 产品 / 入离职 / 目标 这些只有月度口径的指标，'
      + '按覆盖月份（'+DATA.__months.join('、')+'）的<b>整月值</b>呈现，与上方净业绩（按天）不完全可比。要看月度模块的准确数，请选择整月区间。';
  } else { w.style.display='none'; }
}

var TABS=[
  {name:'🏠 首页总览',key:'overview'},

  {name:'🏢 部门与人员',key:'dept'},

  {name:'📚 资料中心',key:'docs'},

];
var ACTIVE_TAB='overview';

function switchTab(key){
  ACTIVE_TAB=key;
  var btns=document.querySelectorAll('.tab-btn');
  TABS.forEach(function(t,i){ if(btns[i]) btns[i].className='tab-btn grp'+(t.key===key?' active':''); });
  document.querySelectorAll('.tab-content').forEach(function(c){
    c.style.display = (c.id==='content_'+key)?'block':'none';
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildTabs(){
  var bar=$('tabBar'), tc=$('tabContents');
  bar.innerHTML=''; tc.innerHTML='';
  TABS.forEach(function(t){
    var on = (t.key===ACTIVE_TAB);
    var btn=document.createElement('button');
    btn.className='tab-btn grp'+(on?' active':'');
    btn.textContent=t.name;
    btn.onclick=function(){ switchTab(t.key); };
    bar.appendChild(btn);
    var div=document.createElement('div');
    div.className='tab-content';
    div.id='content_'+t.key;
    div.style.display=on?'block':'none';
    div.innerHTML=renderTab(t.key);
    tc.appendChild(div);
  });
}

/* ---- 1. 首页总览 ---- */
function renderOverview(){
  const K=DATA.kpi, M=DATA.monthly, dates=DATA.dates, net=DATA.net_daily;
  const days=dates.length, total=K.cur_net, avg=K.cur_avg;

  /* ---- KPI：全部随区间重算，快照类单独标注 ---- */
  // 达成率只在「区间月份 == 有目标的月份」且都是完整月时才给，避免与区间业绩不同源
  const attPartial = (DATA.__months||[]).some(function(m){ return K.tgt_months && K.tgt_months.indexOf(m)>=0 && !(M.find(x=>x.m===m)||{full:true}).full; });
  const attAligned = (K.tgt_months && K.tgt_months.length>0) && K.tgt_months.length===M.length && !attPartial;
  const att = (attAligned && K.tgt_sum>0) ? (K.tgt_net/K.tgt_sum*100) : null;
  const attNote = attAligned
      ? `目标 ${fmtW(K.tgt_sum)}（${K.tgt_months.map(MN).join('、')}）`
      : ((K.tgt_months && K.tgt_months.length)
          ? '目标只有整月口径，未与当前区间对齐<br>整月达成请到「业绩目标」页'
          : '所选区间内无目标表');
  const momNote = (K.mom==null)
      ? '无可比基期（已到数据起点）'
      : (K.mom_basis==='month' ? `对比前 ${M.length} 个自然月` : `对比前 ${days} 天（等长区间）`);
  const kpis=[
    {l:'区间净业绩', v:fmtW(total), u:'', n:`${RANGE.label}　共 ${days} 天　日均 ${fmtW(avg)}`},
    {l:'区间环比', v:(K.mom==null?'—':sign(K.mom)+K.mom.toFixed(1)), u:(K.mom==null?'':'%'), n:momNote},
    {l:'目标达成', v:(att==null?'—':att.toFixed(1)), u:(att==null?'':'%'), n:attNote},
    {l:'在岗人数 <span class="chip n">当前快照</span>', v:K.hc_now, u:'人',
     n:`正式 ${K.formal} · 试用 ${K.trial} · 试岗 ${K.shigang}`},
    {l:'区间人均产值', v:(K.eff_now==null?'—':fmtW(K.eff_now)), u:'',
     n:`按天加权在岗 ${K.hc_avg?K.hc_avg.toFixed(1):'—'} 人（月度口径）`},
    {l:'区间入 / 离职', v:K.in_cur+' / '+K.out_cur, u:'人',
     n:`净增 ${K.in_cur-K.out_cur>=0?'+':''}${K.in_cur-K.out_cur} 人（月度口径）`}
  ];
  const kpiHtml = kpis.map(k=>`<div class="kpi"><div class="k-label">${k.l}</div><div class="k-val">${k.v}<small>${k.u}</small></div><div class="k-note">${k.n}</div></div>`).join('');

  /* ---- 图表 ---- */
  const bar = barChart(M.map(x=>MN(x.m)), M.map(x=>x.net), {h:280, sub:M.map(x=>x.mom), vfmt:v=>fmtW(v)});
  const effLine = barChart(M.map(x=>MN(x.m)), M.map(x=>DATA.eff_month[x.m]||0), {h:260, vfmt:v=>fmtW(v), colorFn:()=>'#a855f7'});

  const dailyCard = (days>=7 && days<=130)
    ? `<div class="card"><h3>日净业绩 <span class="tag">${dates[0]} ~ ${dates[dates.length-1]}　${days} 天</span></h3>
        <div class="desc">蓝线=每日净业绩；橙虚线=7 日移动平均</div>${lineChart(dates, net, {h:300})}</div>`
    : '';

  const tgtCard = (K.tgt_months && K.tgt_months.length)
    ? `<div class="card"><h3>目标 vs 实际 <span class="tag">${K.tgt_months.map(MN).join('、')}</span></h3>
        <div class="desc">目标取自「百货每月业绩目标.xlsx」；达成率按整月口径</div>
        ${barChart(K.tgt_months.flatMap(m=>[MN(m)+'目标', MN(m)+'净业绩']),
          K.tgt_months.flatMap(m=>[(DATA.targets_sum[m]||{}).target||0, (DATA.__rawNetOf?DATA.__rawNetOf(m):0)]),
          {h:250, vfmt:v=>fmtW(v), colorFn:(i)=> i%2===0? '#c7d2fe':'url(#barGrad)'})}</div>`
    : '';

  /* ---- 核心结论：按当前区间动态生成 ---- */
  const peakM = M.reduce((a,b)=>b.net>a.net?b:a, M[0]);
  const lowM  = M.reduce((a,b)=>b.net<a.net?b:a, M[0]);
  const bestI = net.indexOf(Math.max.apply(null,net));
  const worstI= net.indexOf(Math.min.apply(null,net));
  const aboveAvg = net.filter(v=>v>=avg).length;
  const zeroDays = net.filter(v=>v===0).length;
  const trialPct = K.hc_now ? Math.round(pct(K.trial+K.shigang,K.hc_now)) : 0;

  const bm=DATA.brand_month;
  const brandTot=Object.keys(bm).map(k=>({k:k,v:Object.values(bm[k]).reduce((a,c)=>a+c,0)})).sort((a,b)=>b.v-a.v);
  const brandSum=brandTot.reduce((a,b)=>a+b.v,0);
  const top2=brandTot.slice(0,2);
  const netBase = (K.month_net_full || (DATA.recon && DATA.recon.net_sum)) || brandSum;
  const top2Pct = netBase? pct(top2.reduce((a,b)=>a+b.v,0), netBase) : 0;

  const ins1 = `<li><b>区间业绩：</b>${days} 天合计 <b>${fmtW(total)}</b>，日均 ${fmtW(avg)}；`
    + (K.mom==null ? '无可比基期（已到数据起点）。'
        : (K.mom_basis==='month'
            ? `较前 ${M.length} 个自然月 <span class="${momCls(K.mom)}">${momTxt(K.mom)}</span>。`
            : `较此前等长的 ${days} 天 <span class="${momCls(K.mom)}">${momTxt(K.mom)}</span>。`)) + `</li>`;
  const ins2 = `<li><b>波动特征：</b>单日最高 <b>${dates[bestI]}　${fmtW(net[bestI])}</b>，单日最低 ${dates[worstI]}　${fmtW(net[worstI])}；`
    + `高于日均的天数 ${aboveAvg} 天（${pct(aboveAvg,days).toFixed(0)}%）` + (zeroDays?`，零业绩 ${zeroDays} 天（源表未填报）`:'') + `。</li>`;
  const ins3 = M.length>1
    ? `<li><b>月度走势：</b>区间内最高 ${MN(peakM.m)} <b>${fmtW(peakM.net)}</b>，最低 ${MN(lowM.m)} ${fmtW(lowM.net)}，`
      + `峰谷差 ${fmtW(peakM.net-lowM.net)}。${DATA.__partial?'（当前区间含不完整月份，月度值为该月已发生额）':''}</li>`
    : `<li><b>月度走势：</b>区间仅覆盖 ${MN(M[0].m)} 一个月，${fmtW(M[0].net)}。</li>`;
  const ins4 = brandTot.length
    ? `<li><b>品牌集中度：</b>Top2 为 ${top2.map(x=>x.k+' '+fmtW(x.v)).join('、')}，合计占 ${DATA.__months.join('、')} 整月净业绩 <b>${top2Pct.toFixed(1)}%</b>（品牌为月度口径，与上方区间业绩不同源）；`
      + `覆盖月份：${DATA.__months.join('、')}。</li>`
    : `<li><b>品牌维度：</b>所选区间过短，无可用月度品牌数据，请扩大区间。</li>`;
  const ins5 = `<li><b>人员与招聘：</b>当前在岗 <b>${K.hc_now} 人</b>，试用+试岗占 ${trialPct}%；已接 offer 未到岗 ${K.offer_pending} 人，招聘在途 ${K.recruit_star} 条记录仍在推进。</li>`;
  const insights = `<ul class="insight">${ins1}${ins2}${ins3}${ins4}${ins5}</ul>`;

  const warnCard = DATA.__partial
    ? `<div class="note" style="margin-bottom:14px">当前区间 <b>${RANGE.label}</b> 不是完整自然月：净业绩按天统计，而品牌 / 品类 / 产品 / 入离职 / 目标为月度口径（取覆盖月份整月值），两类指标不完全可比。</div>`
    : '';

  return `
  ${warnCard}
  <div class="kpi-grid">${kpiHtml}</div>
  <div class="card"><h3>核心结论 <span class="tag">随所选时间段动态生成</span></h3>
    <div class="desc">统计区间 ${dates[0]} ~ ${dates[dates.length-1]}（${days} 天）· 数据快照 ${DATA.snapshot}</div>${insights}</div>
  <div class="card"><h3>月度净业绩与环比</h3><div class="desc">单位：万元（柱顶为绝对值，柱下为环比；红涨绿跌）。不完整月份不计算环比</div>${bar}</div>
  <div class="card"><h3>月度人均产值</h3><div class="desc">净业绩 ÷ 月末在岗人数（含试用/试岗，全口径）</div>${effLine}</div>
  ${dailyCard}
  ${tgtCard}`;
}

/* ---- 2. 业绩趋势 ---- */
function renderTrend(){
  const net=DATA.net_daily, dates=DATA.dates, M=DATA.monthly;
  const line = lineChart(dates, net, {h:320});
  const rows = M.map(x=>{
    const h=DATA.hc_month[x.m];
    return [MN(x.m), fmt2(x.net), fmtN(x.days), fmt2(x.avg), `<span class="${momCls(x.mom)}">${momTxt(x.mom)}</span>`,
      h.total, h.in, h.out, fmt2(x.net/h.total)];
  });
  const tb = table(['月份','净业绩(元)','天数','日均(元)','环比','月末在岗','入职','离职','人均月产值(元)'], rows, {numCols:[1,2,3,4,5,6,7,8], maxH:420});

  // 最近30天
  const last30d = dates.slice(-30), last30v = net.slice(-30);
  const avg30 = last30v.reduce((a,b)=>a+b,0)/(last30v.length||1);
  const l30 = barChart(last30d.map((d,i)=>(i%5===0?d.slice(5):'')), last30v, {h:270, vfmt:v=>fmtW(v), hideVal:true, colorFn:(i)=> (last30v[i]>=avg30? '#7c3aed':'#c4b5fd')});

  const best = [...Array(net.length).keys()].sort((a,b)=>net[b]-net[a]).slice(0,5).map(i=>({d:dates[i],v:net[i]}));
  const worst = [...Array(net.length).keys()].sort((a,b)=>net[a]-net[b]).slice(0,5).map(i=>({d:dates[i],v:net[i]}));
  const bestRow = `<div class="grid2"><div><div class="desc" style="margin:0 0 8px">单日最高 5 天</div>${table(['日期','净业绩'],best.map(x=>[x.d,fmt2(x.v)]),{numCols:[1]})}</div>
  <div><div class="desc" style="margin:0 0 8px">单日最低 5 天</div>${table(['日期','净业绩'],worst.map(x=>[x.d,fmt2(x.v)]),{numCols:[1]})}</div></div>`;

  return `
  <div class="card"><h3>日净业绩全区间 <span class="tag">${dates[0]} ~ ${dates[dates.length-1]}</span></h3>
    <div class="desc">蓝线=每日净业绩；橙虚线=7 日移动平均。数据取自「百货每日净业绩」表『净业绩』列，共 ${net.length} 天。</div>${line}</div>
  <div class="card"><h3>月度经营明细</h3><div class="desc">在岗人数为月末口径（到岗日期≤月末 且 未离职）</div>${tb}
    ${(DATA.dates.indexOf('2026-10-31')>=0 && M[M.length-1].days>1) ? `<div class="note">2026-10-31 当日「净业绩」为 0（源表未填报），已按原值计入 10 月合计与日均，未做剔除或补值；如需剔除该日，10 月日均将由 ${fmt2(M[M.length-1].avg)} 元升至 ${fmt2(M[M.length-1].net/(M[M.length-1].days-1))} 元。</div>`:''}</div>
  <div class="card"><h3>最近 30 天日净业绩</h3><div class="desc">${last30d[0]} ~ ${last30d[last30d.length-1]}；深色=高于 30 日均值 ${fmt2(avg30)} 元，浅色=低于均值</div>${l30}</div>
  <div class="card"><h3>极值日</h3>${bestRow}</div>`;
}

/* ---- 3. 品牌与产品 ---- */
function renderBrand(){
  const bm=DATA.brand_month, order=DATA.brand_order, M=DATA.monthly;
  const btot = order.filter(b=>bm[b]).map(b=>({k:b, v:Object.values(bm[b]).reduce((a,c)=>a+c,0)}))
                    .sort((a,b)=>b.v-a.v);
  const total = btot.reduce((a,b)=>a+b.v,0);
  if(!total) return `<div class="card"><h3>品牌与产品</h3><div class="empty">所选区间缺少月度品牌数据（品牌 / 产品只有月度口径）。请把时间段扩大到至少一个完整自然月。</div></div>`;
  const donutItems = btot.map((x,i)=>({k:x.k,v:x.v,c:PALETTE[i%PALETTE.length]}));
  const donutHtml = donut(donutItems);
  const ML = DATA.__months.length;
  const MLBL = ML + ' 个月合计(元)';
  const lastM = M[M.length-1], prevM2 = M.length>1 ? M[M.length-2] : null;
  const prevKey = prevM2 ? prevM2.m : null;

  // 堆叠柱（按品牌×月）
  const monthLabels = M.map(x=>MN(x.m));
  const series = btot.slice(0,6).map((b,i)=>({name:b.k, color:PALETTE[i%PALETTE.length], values:M.map(x=> (bm[b.k]||{})[x.m]||0)}));
  const stack = stackedChart(monthLabels, series, {h:330});
  const legend = `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}<span><i style="background:#e2e8f0"></i>其余合计</span></div>`;

  // 品类
  const cm=DATA.cat_month, cats=DATA.cat_order.filter(c=>cm[c]).map(c=>({k:c,v:Object.values(cm[c]).reduce((a,x)=>a+x,0)})).sort((a,b)=>b.v-a.v);
  const catBars = hbars(cats, {vfmt:v=>fmtW(v), pctOf:total});

  // 产品 top20
  const prods=Object.entries(DATA.prod_month).map(([k,v])=>({k, v:Object.values(v).reduce((a,b)=>a+b,0), m:v})).sort((a,b)=>b.v-a.v);
  const top20=prods.slice(0,20).map(p=>[p.k, DATA.prod_brand[p.k], DATA.prod_cat[p.k], fmt2(p.v), (p.v/total*100).toFixed(2)+'%',
    fmtW((p.m[lastM.m]||0)), fmtW((p.m[prevKey]||0))]);
  const prodTb = table(['产品','品牌','品类',MLBL,'占大盘',MN(lastM.m),prevM2?MN(prevM2.m):'—'], top20, {numCols:[3,4,5,6], maxH:560});

  const brandRows = btot.map(b=>{
    const cur=(bm[b.k]||{})[lastM.m]||0, prev=(bm[b.k]||{})[prevKey]||0;
    const mom = prev? ((cur/prev-1)*100):null;
    return [b.k, fmt2(b.v), (b.v/total*100).toFixed(2)+'%', fmt2(cur), `<span class="${momCls(mom)}">${momTxt(mom)}</span>`, fmt2(prev)];
  });

  return `
  <div class="card"><h3>品牌结构（${ML} 个月累计）<span class="tag">${DATA.__months.join('、')}</span></h3>
    <div class="desc">按产品名归集品牌；合计 ${fmtW(total)}，与净业绩差异见「口径与校验」。组合装/其他=「柚子草莓酒组合装」。${DATA.__partial?'<b style="color:#b45309">当前区间含不完整月份，此处为整月口径</b>':''}</div>${donutHtml}</div>
  <div class="card"><h3>品牌 × 月度 堆叠</h3><div class="desc">Top6 品牌按月堆叠；颜色与上图一致</div>${stack}${legend}</div>
  <div class="card"><h3>品类结构</h3><div class="desc">按产品品类归集（乐器按吉他/电吉他/尤克里里/小提琴/配件细分）</div>${catBars}</div>
  <div class="card"><h3>品牌月度明细</h3>${table(['品牌',MLBL,'占比',MN(lastM.m)+'(元)','环比',(prevM2?MN(prevM2.m):'—')+'(元)'], brandRows, {numCols:[1,2,3,4,5]})}</div>
  <div class="card"><h3>产品 Top20</h3><div class="desc">按 ${ML} 个月累计净业绩排序</div>${prodTb}</div>`;
}
function sum(o){ return Object.values(o||{}).reduce((a,b)=>a+b,0); }

/* ---- 3b. 业绩目标 ---- */
function renderTargets(){
  // 目标表只有 2026-09 / 2026-10 两期，本页固定用原始月度数据，不随上方时间段变化
  const T=DATA.targets, TS=DATA.targets_sum, M=RAW.monthly;
  const netOf = m => (M.find(x=>x.m===m)||{}).net||0;
  const t9=T['2026-09'], t10=T['2026-10'];
  const kpi = [
    {l:'9 月目标（团队合计）', v:fmtW(TS['2026-09'].target), n:`冲刺 ${fmtW(TS['2026-09'].stretch)}`},
    {l:'9 月净业绩 / 达成', v:fmtW(netOf('2026-09')), n:`达成 <b>${(netOf('2026-09')/TS['2026-09'].target*100).toFixed(1)}%</b>　（目标表填报完成 ${fmtW(TS['2026-09'].actual_reported)}）`},
    {l:'10 月目标（团队合计）', v:fmtW(TS['2026-10'].target), n:`冲刺列未填`},
    {l:'10 月净业绩 / 达成', v:fmtW(netOf('2026-10')), n:`达成 <b>${(netOf('2026-10')/TS['2026-10'].target*100).toFixed(1)}%</b>　（完成情况列未回填）`}
  ].map(k=>`<div class="kpi"><div class="k-label">${k.l}</div><div class="k-val">${k.v}</div><div class="k-note">${k.n}</div></div>`).join('');

  // 9月团队达成
  const rows9 = t9.teams.map(t=>{
    const a = t.actual;
    const r = a==null? null : a/t.tgt*100;
    return [t.leader, t.team, fmt2(t.tgt), fmt2(t.spr||0), a==null?'—':fmt2(a),
      r==null?'—':`<span class="${r>=100?'up':'down'}">${r.toFixed(1)}%</span>`,
      a==null?'—':fmt2(a-t.tgt), t.members.length];
  });
  const bars9 = hbars(t9.teams.map(t=>({k:t.team, v:t.actual||0, c:(t.actual||0)>=t.tgt?'#dc2626':'#7c3aed'})), {vfmt:v=>fmtW(v), pl:170});

  // 10月按组长汇总
  const byLeader={};
  t10.teams.forEach(t=>{
    const k=t.leader||'(空)';
    byLeader[k]=byLeader[k]||{tgt:0,teams:0,members:0};
    byLeader[k].tgt += t.tgt||0; byLeader[k].teams += 1;
    byLeader[k].members += (t.members||[]).filter(m=>m.n).length;
  });
  const leaderRows = Object.entries(byLeader).sort((a,b)=>b[1].tgt-a[1].tgt)
    .map(([k,v])=>[k, v.teams, v.members, fmt2(v.tgt), (v.tgt/TS['2026-10'].target*100).toFixed(1)+'%']);

  // 9月个人达成排行
  const persons=[];
  t9.teams.forEach(t=>t.members.forEach(m=>{
    if(m.actual==null||!m.tgt) return;
    persons.push({n:m.n, team:t.team, tgt:m.tgt, act:m.actual, r:m.actual/m.tgt*100});
  }));
  persons.sort((a,b)=>b.r-a.r);
  const pRows = persons.map(p=>[p.n, p.team, fmt2(p.tgt), fmt2(p.act),
    `<span class="${p.r>=100?'up':(p.r>=80?'flat':'down')}">${p.r.toFixed(1)}%</span>`]);
  const miss = t9.teams.flatMap(t=>t.members.filter(m=>m.actual==null).map(m=>`${m.n}（${t.team}）`));

  return `
  <div class="note" style="margin-bottom:14px">本页为 9 月 / 10 月目标表专项分析，<b>固定展示这两期完整数据，不随上方时间段变化</b>（目标表只有这两期）。当前页面区间：${RANGE.label}。</div>
  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">${kpi}</div>
  <div class="card"><h3>9 月团队达成 <span class="tag">目标表填报口径</span></h3>
    <div class="desc">团队目标来自「百货每月业绩目标」9 月表；完成情况为团队汇总列。注：目标为"奖金业绩目标"，与净业绩列存在口径差异，故同时呈现两套数。</div>
    ${table(['组长','团队','团队目标','冲刺(120%)','完成(填报)','达成率','缺口','在册人数'], rows9, {numCols:[2,3,4,5,6,7]})}
  </div>
  <div class="card"><h3>9 月团队完成额</h3><div class="desc">红色=达成目标，紫色=未达成</div>${bars9}</div>
  <div class="card"><h3>10 月目标结构（按组长汇总）</h3>
    <div class="desc">10 月表仅到「团队目标 + 个人目标」，冲刺目标与完成情况未填</div>
    ${table(['组长','团队数','覆盖人数','目标合计(元)','占总量'], leaderRows, {numCols:[1,2,3,4]})}
  </div>
  <div class="card"><h3>9 月个人达成排行 <span class="tag">${persons.length} 人</span></h3>
    <div class="desc">仅统计目标>0 且有完成情况的人；红=达成、绿=低于 80%</div>
    ${table(['姓名','团队','个人目标','完成','达成率'], pRows, {numCols:[2,3,4], maxH:520})}
  </div>
  <div class="card"><h3>数据缺口</h3>
    <div class="note">${miss.length? '目标表中有 '+miss.length+' 人完成情况为空：'+miss.join('、') : '无'}<br>
    9 月「洗地机」团队完成情况整列为空；10 月全部完成情况未回填。</div>
  </div>`;
}

/* ---- 3c. 过程爆文 ---- */
function renderBaowen(){
  const B=DATA.bw_total, BW=DATA.baowen;
  const kpi = [
    {l:'爆文条数', v:B.cnt, u:'条', n:`覆盖 ${B.people} 人`},
    {l:'总点赞', v:fmtN(B.like), u:'', n:`单条最高 ${fmtN(BW.length?Math.max.apply(null,BW.map(r=>r.like||0)):0)}`},
    {l:'总阅读', v:fmtW(B.read), u:'', n:`10 万+ 阅读 ${B.over100k} 条`},
    {l:'累计积分', v:B.pt, u:'分', n:`人均 ${B.people?(B.pt/B.people).toFixed(1):'—'} 分`}
  ].map(k=>`<div class="kpi"><div class="k-label">${k.l}</div><div class="k-val">${k.v}<small>${k.u}</small></div><div class="k-note">${k.n}</div></div>`).join('');

  const deptBars = hbars(Object.entries(DATA.bw_by_dept).map(([k,v])=>({k:k,v:v.cnt})), {vfmt:v=>v+' 条', pl:96, pr:78, vw:520});
  const deptLike = hbars(Object.entries(DATA.bw_by_dept).map(([k,v])=>({k:k,v:v.like})), {vfmt:v=>fmtN(v), pl:96, pr:96, vw:520});
  const grpBars = hbars(Object.entries(DATA.bw_by_grp).map(([k,v])=>({k:k,v:v.cnt})), {vfmt:v=>v+' 条', pl:126, pr:64, vw:520});
  const monBars = hbars(Object.entries(DATA.bw_by_month).map(([k,v])=>({k:k==='(未填)'?'未填日期':k, v:v.cnt})), {vfmt:v=>v+' 条', pl:94, pr:70, vw:520});

  const topP = Object.entries(DATA.bw_by_person).slice(0,15);

    (v.like/v.cnt).toFixed(0)]);
  const prodRows = Object.entries(DATA.bw_by_prod).sort((a,b)=>b[1].cnt-a[1].cnt).slice(0,12)
    .map(([p,v])=>[p, v.cnt, fmtN(v.like), fmtW(v.read), v.pt]);

  const detail = [...BW].sort((a,b)=>(b.d||'').localeCompare(a.d||'')).map(r=>[

  return `
  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">${kpi}</div>
  <div class="grid2">
    <div class="card"><h3>爆文条数 · 按部门</h3>${deptBars}</div>

  </div>
  <div class="grid2">
    <div class="card"><h3>爆文条数 · 按组/账号池</h3><div class="desc">星辰一部拆到组，二/三部按部门整体登记</div>${grpBars}</div>
    <div class="card"><h3>爆文条数 · 按月份</h3>${monBars}</div>
  </div>
  <div class="card"><h3>个人产出 Top15</h3><div class="desc">按条数排序，末列为单条平均点赞</div>
  ${table(['#','姓名','条数','总点赞','总阅读','积分','条均点赞'], pRows, {numCols:[0,2,3,4,5,6]})}</div>
  <div class="card"><h3>产品爆文分布 Top12</h3>
  ${table(['产品','条数','总点赞','总阅读','积分'], prodRows, {numCols:[1,2,3,4]})}</div>
  <div class="card"><h3>爆文明细 <span class="tag">${BW.length} 条</span></h3>
    <div class="desc">取自 5 张爆文统计表（冯文露组/曹师箐组/刘倩组/星辰二部/星辰三部）；已剔除模板占位行</div>
    ${table(['发布日期','部门','组','姓名','产品','点赞','阅读','积分'], detail, {numCols:[5,6,7], maxH:560})}</div>
  <div class="card"><h3>口径提示</h3>
    <div class="note">爆文表只登记"已达标提报"的笔记，非全量发布量，故条数≠发稿量；积分按各表「积分」列累加；存在 2 处源表异常值（孔晓钰 9/30 阅读量填 2、陈书莹 10/15 点赞 4.6→5），已按原值保留。</div>
  </div>`;
}

/* ---- 4. 部门与人员 ---- */
function renderDept(){
  const ds=DATA.dept_snap, P=DATA.people_active, K=DATA.kpi;
  const depts=Object.keys(ds);
  const deptRows = depts.map(d=>{
    const s=ds[d];
    return [d, s.active, s.formal, s.trial, s.shigang, s.in_cur, s.out_cur, s.left_all, s.recruit, s.iv];
  });
  const deptTb = table(['部门','在岗','正式','试用','试岗','本月入职','本月离职','历史离职','招聘记录','面谈记录'], deptRows, {numCols:[1,2,3,4,5,6,7,8,9]});

  const stageItems=[
    {k:'正式员工', v:P.filter(p=>p.stage==='正式员工').length, c:'#4f46e5'},
    {k:'试用期', v:P.filter(p=>p.stage==='试用期').length, c:'#a855f7'},
    {k:'试岗', v:P.filter(p=>p.stage==='试岗').length, c:'#f59e0b'}
  ];
  const stageDonut = donut(stageItems,{vw:520,h:300});

  // 人员名单
  const peopleRows = [...P].sort((a,b)=>(a.dept+b.join).localeCompare(b.dept+b.join)).map(p=>[
    p.n, p.dept, p.grp||'—', p.lv||'—',
    `<span class="chip ${p.stage==='正式员工'?'g':(p.stage==='试用期'?'b':'y')}">${p.stage}</span>`,
    p.join, p.main? p.main : '<span class="chip r">未挂品</span>',
    (p.aux||[]).join('、')||'—'
  ]);
  const pTb = table(['姓名','部门','组','职级','阶段','到岗日期','主推品','辅推品'], peopleRows, {maxH:560, nw:[0,1,2,3,4,5]});

  // 主推品分布
  const mp={};
  P.forEach(p=>{ if(p.main) mp[p.main]=(mp[p.main]||0)+1; });
  const mpItems=Object.entries(mp).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const mpBars=hbars(mpItems,{vfmt:v=>v+' 人', pl:196, pr:64, vw:520, rh:26});
  const mpBarsWide=hbars(mpItems,{vfmt:v=>v+' 人', pl:230, pr:90, vw:1000, rh:28});

  // 无主推品
  const un = DATA.pp_unmatched;
  const unHtml = un.length? `<div class="note">未在「人员-产品」表登记主推品（建议补齐，否则无法追溯业绩归属）：<b>${un.join('、')}</b></div>`:'<div class="note">全部在职人员均已登记主推品 ✔</div>';

  return `
  <div class="card"><h3>部门人员快照</h3><div class="desc">在岗=${K.hc_now} 人（月末口径）；历史离职含自离/优化</div>${deptTb}</div>
  <div class="grid2">
    <div class="card"><h3>在职阶段结构</h3><div class="desc">试用+试岗占比 ${Math.round(pct(K.trial+K.shigang,K.hc_now))}%</div>${stageDonut}</div>
    <div class="card"><h3>产品归属缺口</h3><div class="desc">人员-产品对照完整性检查</div>${unHtml}
      <div class="note">「人员-产品」表仅 ${DATA.people.filter(p=>p.main).length} 人登记，覆盖在职 ${P.length} 人中的 ${Math.round(pct(DATA.people.filter(p=>p.main&&p.st==='在职').length,P.length))}%。业绩表为产品维度，未登记主推品者无法反查个人贡献。</div>
    </div>
  </div>
  <div class="card"><h3>在职人员名单 <span class="tag">${P.length} 人</span></h3><div class="desc">来自「员工花名册」望辰-Crown事业部 · 在职状态=在职；产品归属来自「人员-产品」表</div>${pTb}</div>
  <div class="card"><h3>主推品人员分布</h3><div class="desc">每品挂人数（同品多人=共享）；全宽展示便于对照</div>${mpBarsWide}</div>
  <div class="card"><h3>人员编制</h3>
    ${(()=>{
      const t10=DATA.targets['2026-10'].teams;
      const names=new Set(); t10.forEach(t=>(t.members||[]).forEach(m=>{ if(m.n) names.add(m.n); }));
      const t9=DATA.targets['2026-09'].teams;
      const names9=new Set(); t9.forEach(t=>(t.members||[]).forEach(m=>{ if(m.n) names9.add(m.n); }));
      return `<div class="desc">源表中「百货中心26年人员编制 / 27年人员编制 / 编制差距」仅有文件名、无链接，编制数无法读取，故本模块暂以「目标表覆盖人数」作参照，不与在岗人数混用。</div>
      ${table(['口径','人数','说明'],[
        ['10 月目标表覆盖人数', names.size, '10 月目标表中出现的负责人去重'],
        ['9 月目标表覆盖人数', names9.size, '9 月目标表中出现的负责人去重'],
        ['当前在岗（花名册）', DATA.kpi.hc_now, '到岗≤月末且未离职'],
        ['目标覆盖缺口', names.size - DATA.kpi.hc_now, '正=目标表列名多于在岗（有岗无人）；负=在岗多于目标表列名（有人未定目标）'],
        ['在岗但未进目标表', DATA.kpi.hc_now - [...names].filter(n=>DATA.people_active.some(p=>p.n===n)).length, '在岗但 10 月目标表未列名']
      ], {numCols:[1]})}
      <div class="note">编制数据接入后，此表将替换为「编制 / 在岗 / 缺口 / 超编」四列对照。</div>`;
    })()}
  </div>`;
}

/* ---- 5. 招聘漏斗 ---- */
function renderRecruit(){
  const T=DATA.recruit_total, K=DATA.kpi, RM=DATA.recruit_month;
  const steps=[
    {k:'面试', v:T.interview, c:'#4f46e5'},
    {k:'已接 offer', v:T.offer_accept, c:'#6d28d9'},
    {k:'实际到岗', v:T.onboard, c:'#a855f7'},
    {k:'当前在职', v:T.now_active, c:'#c026d3'}
  ];
  const max=steps[0].v;
  const funnelHtml = steps.map((s,i)=>{
    const w=Math.max(s.v/max*100,6);
    const rate = i===0? '' : `转化 ${(s.v/steps[i-1].v*100).toFixed(1)}%`;
    return `<div class="funnel-row"><div class="fl">${s.k}</div>
      <div class="fb" style="width:${w}%;background:${s.c}">${s.v} 人</div>
      <div class="fc">${rate}</div></div>`;
  }).join('');

  const months=Object.keys(RM);
  const ivBars = stackedChart(months.map(MN), [
      {name:'面试', color:'#4f46e5', values:months.map(m=>RM[m].interview)},
      {name:'到岗', color:'#a855f7', values:months.map(m=>RM[m].onboard)},
      {name:'离职', color:'#f59e0b', values:months.map(m=>RM[m].leave)}
    ], {h:330});
  const legend=`<div class="legend"><span><i style="background:#4f46e5"></i>面试</span><span><i style="background:#a855f7"></i>到岗</span><span><i style="background:#f59e0b"></i>离职</span></div>`;

  const srcItems=DATA.recruit_source.filter(x=>x[0]!=='(空)').map(x=>({k:x[0],v:x[1]}));
  const srcBars=hbars(srcItems,{vfmt:v=>v+' 场', pctOf:T.interview, pl:96, vw:520});
  const postItems=DATA.recruit_post.filter(x=>x[0]!=='(空)').map(x=>({k:x[0],v:x[1]}));
  const postBars=hbars(postItems,{vfmt:v=>v+' 场', pctOf:T.interview, pl:150, vw:520});

  const monthRows = months.map(m=>[MN(m), RM[m].interview, RM[m].onboard, RM[m].leave,
    RM[m].interview? (RM[m].onboard/RM[m].interview*100).toFixed(1)+'%':'—']);

  return `
  <div class="card"><h3>招聘漏斗（星辰一~四部 · 2025-05 至 2026-10 累计）</h3>
    <div class="desc">数据源「招聘数据表」二级架构以『星辰』开头的 ${T.interview} 条记录；到岗按『到岗=是』计</div>${funnelHtml}
    <div class="note">面试→到岗转化 ${(T.onboard/T.interview*100).toFixed(1)}%；到岗后留存 ${(T.now_active/T.onboard*100).toFixed(1)}%（${T.now_active}/${T.onboard}）；离职（自离+劝退）${T.leave} 人。</div>
  </div>
  <div class="card"><h3>月度面试 / 到岗 / 离职</h3><div class="desc">离职按『离职日期』月份统计</div>${ivBars}${legend}</div>
  <div class="grid2">
    <div class="card"><h3>简历来源</h3><div class="desc">面试场次来源占比</div>${srcBars}</div>
    <div class="card"><h3>应聘岗位</h3><div class="desc">Top10 岗位</div>${postBars}</div>
  </div>
  <div class="card"><h3>月度招聘明细</h3>${table(['月份','面试','到岗','离职','到岗率'], monthRows, {numCols:[1,2,3,4]})}</div>`;
}

/* ---- 6. 招聘需求 ---- */
function renderDemand(){
  const D=DATA.demand_star;
  const byDept={}, byPost={}, byMonth={}, byUrg={}, byAppr={};
  D.forEach(x=>{
    const dp=x['二级架构']||'(空)'; byDept[dp]=(byDept[dp]||0)+(+x['人数']||0);
    const po=x['岗位']||'(空)'; byPost[po]=(byPost[po]||0)+(+x['人数']||0);
    const mo=x['需求月']||'(空)'; byMonth[mo]=(byMonth[mo]||0)+(+x['人数']||0);
    const ug=x['岗位紧急度']||'(空)'; byUrg[ug]=(byUrg[ug]||0)+(+x['人数']||0);
    const ap=(x['hrbp审批']||'未填')+'/'+(x['人资审批']||'未填'); byAppr[ap]=(byAppr[ap]||0)+1;
  });
  const totalHead=D.reduce((a,x)=>a+(+x['人数']||0),0);
  const mk=(o)=>Object.entries(o).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const rows=[...D].sort((a,b)=>String(b['需求月']).localeCompare(String(a['需求月'])))
    .map(x=>[x['需求月']||'—', x['二级架构']||'—', x['岗位']||'—', x['职级']||'—', x['人数']||'',
      `<span class="chip ${x['岗位紧急度']==='s'?'r':(x['岗位紧急度']==='a'?'y':'n')}">${(x['岗位紧急度']||'—').toUpperCase()}</span>`,
      x['薪资范围']||'—', x['需求编码']||'—', x['hrbp审批']||'—', x['人资审批']||'—']);
  return `
  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi"><div class="k-label">需求条数（星辰系）</div><div class="k-val">${D.length}<small>条</small></div><div class="k-note">全表 ${DATA.demand_all_count} 条（含其他部门）</div></div>
    <div class="kpi"><div class="k-label">需求总人数</div><div class="k-val">${totalHead}<small>人</small></div><div class="k-note">按『人数』列求和</div></div>
    <div class="kpi"><div class="k-label">S 级（最紧急）</div><div class="k-val">${byUrg['s']||0}<small>人</small></div><div class="k-note">岗位紧急度=s</div></div>
    <div class="kpi"><div class="k-label">实际到岗</div><div class="k-val">${DATA.recruit_total.onboard}<small>人</small></div><div class="k-note">招聘表累计到岗（2025-05 起）</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>需求人数 · 按部门</h3>${hbars(mk(byDept),{vfmt:v=>v+' 人',pl:96,pr:78,vw:520})}</div>
    <div class="card"><h3>需求人数 · 按岗位</h3>${hbars(mk(byPost),{vfmt:v=>v+' 人',pl:150,pr:74,vw:520})}</div>
  </div>
  <div class="grid2">
    <div class="card"><h3>需求人数 · 按需求月</h3>${hbars(mk(byMonth),{vfmt:v=>v+' 人',pl:96,pr:70,vw:520})}</div>
    <div class="card"><h3>审批状态分布（条数）</h3>${hbars(mk(byAppr),{vfmt:v=>v+' 条',pl:132,pr:74,vw:520})}</div>
  </div>
  <div class="card"><h3>需求明细 <span class="tag">${D.length} 条</span></h3><div class="desc">二级架构=星辰一/二/三/四部</div>
  ${table(['需求月','部门','岗位','职级','人数','紧急度','薪资范围','需求编码','HRBP审批','人资审批'], rows, {numCols:[4], maxH:560, nw:[0,1,5,7]})}</div>`;
}

/* ---- 7. 面谈与BP ---- */

  const IV=DATA.interview_star, BP=DATA.bp_star;

  IV.forEach(x=>{ byType[x.type||'(空)']=(byType[x.type||'(空)']||0)+1; byDept[x.dept]=(byDept[x.dept]||0)+1; });
  BP.forEach(x=>{ const k=x.prog||'(空)'; byBp[k]=(byBp[k]||0)+1; });

    <div class="card"><h3>面谈部门分布</h3>${hbars(mk(byDept),{vfmt:v=>v+' 条',pl:96,pr:70,vw:520})}</div>
  </div>
  <div class="card"><h3>BP 任务完成情况</h3>${hbars(mk(byBp),{vfmt:v=>v+' 条',pl:130})}</div>
  <div class="card"><h3>面谈记录 <span class="tag">${IV.length} 条</span></h3><div class="desc">按面谈时间倒序</div>
  ${table(['日期','姓名','部门','类型','在职阶段','面谈人','记录摘要'], ivRows, {maxH:520, nw:[0,1,2,3,4,5]})}</div>
  <div class="card"><h3>BP 工作进度 <span class="tag">${BP.length} 条</span></h3>${table(['任务内容','部门','面谈人','进度','截止','完成'], bpRows, {maxH:480, nw:[1,2,3,4,5]})}</div>`;

/* ---- 8. 资料中心 ---- */
function renderDocs(){
  const docs=DATA.docs;
  const link = it => (it && typeof it==='object') ? `<a class="chip b" href="${it.u||'#'}" target="_blank" rel="noopener" style="text-decoration:none">${it.n}</a>` : `<span class="chip b">${it}</span>`;
  const withLinks = docs.filter(d=>d.items&&d.items.length).length;
  const totalLinks = docs.reduce((a,d)=>a+((d.items||[]).length),0);
  const cards='<div class="grid2" style="align-items:start;margin-top:4px">'+docs.map(d=>`
    <div class="card" style="margin:0">
      <h3 style="font-size:15px">${d.cat} <span class="tag">${(d.items||[]).length} 项</span></h3>
      ${d.items&&d.items.length?`<div style="margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px">${d.items.map(link).join('')}</div>`:'<div class="desc" style="margin:8px 0 0">暂无归档</div>'}
      ${d.todo&&d.todo.length?`<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px">${d.todo.map(i=>`<span class="chip y">待补：${i}</span>`).join('')}</div>`:''}
    </div>`).join('')+'</div>';
  const kpi=`<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi"><div class="k-label">资料类别</div><div class="k-val">${docs.length}<small>类</small></div><div class="k-note">来自「新媒体百货中心」资料库表</div></div>
    <div class="kpi"><div class="k-label">已挂链接</div><div class="k-val">${totalLinks}<small>条</small></div><div class="k-note">可从多维表 URL 字段直达</div></div>
    <div class="kpi"><div class="k-label">有归档的类别</div><div class="k-val">${withLinks}<small>类</small></div><div class="k-note">其余类别暂无上传文件</div></div>
    <div class="kpi"><div class="k-label">待补文件</div><div class="k-val">${docs.filter(d=>d.todo&&d.todo.length).length}<small>类</small></div><div class="k-note">源表仅登记名称、未挂链接</div></div>
  </div>`;
  return kpi+`<div class="card"><h3>资料目录 <span class="tag">点击直达云文档</span></h3>
    <div class="desc">链接已从多维表 URL 字段还原，可直接点击打开对应云文档。</div>
    <div class="note">「人员编制」三份文件在源表中只登记名称、未挂链接，故本页无法直达；补齐链接后即可自动生成入口。</div></div>${cards}`;
}

/* ---- 9. 口径与校验 ---- */
function renderRule(){
  const R=DATA.recon, K=DATA.kpi, meta=DATA.meta;
  const ruleLis = meta.rules.map(r=>`<li>${r}</li>`).join('');
  const diff = R.prod_sum - R.net_sum;
  return `
  <div class="card"><h3>数据源与范围</h3>
    <div class="desc">${meta.source}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${meta.tables.map(t=>`<span class="chip b">${t}</span>`).join('')}</div>
    <div class="note">本工作台对多维表<b>只读</b>，所有数据落在独立目录 baike-workbench/，不写入、不改动任何源表，也不影响其他工作台。</div>
  </div>
  <div class="card"><h3>取数口径</h3><ul class="insight">${ruleLis}</ul></div>
  <div class="card"><h3>时间段口径 <span class="tag">当前：${RANGE.label}　${DATA.dates[0]} ~ ${DATA.dates[DATA.dates.length-1]}</span></h3>
    <div class="desc">页面顶部的时间段选择器会<b>实时重算</b>，不同指标的时间粒度不同，必须分开看：</div>
    ${table(['指标','时间粒度','算法','受区间影响吗'],[
      ['净业绩 / 日均','日','所选日期内『净业绩』逐日求和 ÷ 天数','是，精确到天'],
      ['区间环比','月 / 日','整月对齐→对比前 N 个自然月；否则→对比前 N 天等长区间','是'],
      ['品牌 / 品类 / 产品','月','区间覆盖月份的<b>整月值</b>相加','是，但按整月'],
      ['入 / 离职、人均产值','月','对应月份的月度快照，按天加权','是，但按整月'],
      ['目标达成','月','仅当区间月份与目标月份完全一致且都是完整月才计算','是；不对齐则显示「—」'],
      ['爆文','日','按发布日筛选，聚合重算','是，精确到天'],
      ['在岗人数 / 编制 / 招聘在途','时点','当前花名册与招聘表快照','<b>否</b>，固定为当前值'],
      ['部门结构 / 面谈 / BP / 资料库','时点','当前快照','<b>否</b>']
    ], {numCols:[]})}
    <div class="note">为什么月粒度指标不能按天切：源表里品牌 / 产品 / 品类只有<b>月度汇总</b>，没有「某产品某天卖了多少」。强行按天拆就等于编数，所以一律取整月值，并在区间非整月时给出橙色提示。<br>
    环比为什么有两种：整月区间用自然月对比（与月度柱图一致），非整月区间只能用「前 N 天」等长对比——两者不能混用，否则会得出 -11% 和 -14.1% 两个互相矛盾的数。</div>
  </div>
  <div class="card"><h3>净业绩对账</h3>
    <div class="desc">用「产品明细合计」反向验证『净业绩』列，验证差异应可完全解释</div>
    ${table(['项目','金额(元)','说明'],[
      ['净业绩合计（权威字段）', fmt2(R.net_sum), `${DATA.dates.length} 天『净业绩』列直接求和（${RANGE.label}）`],
      ['产品明细合计（43 个产品列）', fmt2(R.prod_sum), '剔除 5 个品类汇总列与费用列后求和'],
      ['差异', fmt2(diff), `全部来自 ${R.gap_days} 个「每月 1 号」行：品类汇总列 + 小红书费用`]
    ], {numCols:[1]})}
    <div class="note">差异天数=${R.gap_days}，其余 208 天产品明细合计与净业绩<b>完全一致（0 误差）</b>，说明『净业绩』列可信、产品结构可追溯。</div>
  </div>
  <div class="card"><h3>关键口径定义</h3>
    ${table(['指标','计算方式'],[
      ['月度净业绩','当月每日『净业绩』列求和'],
      ['月末在岗人数','到岗日期 ≤ 月末 且（无离职时间 或 离职时间 > 月末）'],
      ['人均月产值','当月净业绩 ÷ 当月末在岗人数（含试用/试岗，全口径）'],
      ['流动强度','当月离职人数 ÷ 当月末在岗人数（非留存率，仅反映当月流失压力）'],
      ['招聘在途','招聘表 offer=已接 且 到岗≠是'],
      ['需求人数','需求总表『人数』列求和，按星辰一~四部筛选']
    ])}
  </div>
  <div class="card"><h3>已知数据缺口（需源表补齐）</h3>
    <ul class="insight">
      <li><b>业绩目标缺失：</b>8 张表中无「百货每月业绩目标」，故本工作台<b>不展示达成率</b>，避免编造目标数。</li>
      <li><b>部门维度业绩缺失：</b>「百货每日净业绩」表只有日期+产品，无部门/组字段，因此<b>部门业绩不可拆分</b>，部门页只呈现人员、招聘、面谈。</li>
      <li><b>产品归属未全覆盖：</b>在职 ${K.hc_now} 人中仅 ${DATA.people.filter(p=>p.main&&p.st==='在职').length} 人登记主推品，${K.unmatched_prod} 人空白。</li>
      <li><b>招聘/花名册口径差异：</b>招聘表到岗 128 人、离职 79 人，花名册望辰仅 98 条档案（在职 40），差异源于花名册保留范围，已在两处各自独立统计、未做强行对齐。</li>
    </ul>
  </div>
  <div class="card"><h3>刷新方式</h3>
    <div class="desc">本页是<b>动态页</b>：打开时自动拉取最新 <code>data.json</code>，页面顶部还有「⟳ 刷新数据」按钮可随时重取，<b>不需要重新生成 HTML</b>。</div>
    <div class="note">后台链路（每天多次自动跑）：抓取金山多维表 → 计算指标 → 推送 data.json 到 GitHub Pages。
    所以数据时效 = 最后一次同步时间，见页首「快照」。<b>当前快照：${DATA.snapshot}</b>；数据区间 ${DATA.dates[0]} ~ ${DATA.dates[DATA.dates.length-1]}（${DATA.dates.length} 天）。<br>
    离线单文件版（钉钉发送的那份）数据是内嵌的，拿到时是什么就是什么，不会自动更新。</div>
  </div>`;
}

/* ============ 初始化 ============ */
function checkPwd(){
  const p=$('pwdInput').value;
  if(p==='zhkj2026'){ $('pwdOverlay').style.display='none'; $('mainContent').style.display='block'; init(); }
  else{ $('pwdError').style.display='block'; }
}
function startApp(){
  var ds=RAW.dates, last=ds[ds.length-1], first=ds[0];
  $('hRange').textContent = first + ' ~ ' + last;
  $('hSnap').textContent = RAW.snapshot + (LIVE_MODE ? '（动态）' : '（离线）');
  ['dFrom','dTo'].forEach(function(id){
    var el=$(id); if(!el) return;
    el.min=first; el.max=last;
  });
  ACTIVE_TAB = window.__FORCE_TAB || 'overview';
  setRange('all', first, last, '全部区间');
  /* 深链：?range=m1 或 注入 window.__FORCE_RANGE 可直接打开指定时间段 */
  var fr = window.__FORCE_RANGE;
  if(!fr){
    var mm=/[?&]range=([a-z0-9]+)/i.exec(location.search);
    if(mm) fr=mm[1];
  }
  if(fr && fr!=='all'){
    var r=presetRange(fr);
    if(r) setRange(fr, r.from, r.to, r.label);
  }
}

/* ---- 动态取数：页面每次打开都拉最新 data.json，改数据不用重新构建 HTML ---- */
function fetchJSON(url){
  var sep = url.indexOf('?')>=0 ? '&' : '?';
  return fetch(url + sep + 'v=' + Date.now(), {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}

function loadLiveData(cb){
  var hint=document.getElementById('loadHint');
  if(hint) hint.textContent='正在获取最新数据…';
  var urls=[LIVE_URL, LIVE_FALLBACK];
  var i=0, lastErr=null;
  (function next(){
    if(i>=urls.length){
      if(hint) hint.textContent='';
      var box=document.getElementById('loadErr');
      if(box){
        box.style.display='block';
        box.innerHTML='<b>最新数据获取失败</b>'+(lastErr?('（'+(lastErr.message||lastErr)+'）'):'')+
          '<br>可能原因：网络中断、或 data.json 尚未发布。'+
          '<button onclick="location.reload()" style="margin-top:8px;font:inherit;font-size:12.5px;padding:5px 14px;border-radius:7px;border:none;background:#4f46e5;color:#fff;cursor:pointer">重新加载</button>';
      }
      return;
    }
    var u=urls[i++];
    fetchJSON(u).then(function(d){
      if(!d || !d.dates || !d.dates.length) throw new Error('数据格式异常');
      RAW=d;
      if(hint) hint.textContent='';
      cb();
    }).catch(function(e){ lastErr=e; next(); });
  })();
}

function reloadLive(){
  if(!LIVE_MODE){ alert('离线单文件版数据已内嵌，无法在线刷新。请打开在线版使用。'); return; }
  loadLiveData(function(){
    setRange(RANGE.key, RANGE.from, RANGE.to, RANGE.label);
    var s=$('rbStatus');
    var old=s.innerHTML;
    s.innerHTML='<b style="color:#059669">已更新 · 快照 '+RAW.snapshot+'</b>';
    setTimeout(function(){ s.innerHTML=old; }, 2600);
  });
}

function init(){
  if(window.__inited) return; window.__inited=true;
  if(RAW){ startApp(); }
  else {
    loadLiveData(function(){ startApp(); });
  }
}
</script>
